services:
  # Northwind Gourmet Market & Jev IA (TypeSafe AI) E-Commerce
  - type: web
    name: northwind-market-jev
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TYPESAFE_API_KEY
        sync: false
